<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星降る夜をこえて</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0e27;
    --bg-mid: #141a3d;
    --star-gold: #ffd866;
    --ember: #ff7a52;
    --ember-dark: #c9482c;
    --creature: #bfe6ff;
    --creature-cheek: #ffc2d1;
    --text-main: #f4f2ff;
    --text-dim: #9aa2c9;
    --panel-bg: rgba(10, 14, 39, 0.86);
    --pu-slow: #9be8ff;
    --pu-score: #ffd866;
    --pu-shield: #b6ffb0;
    --pu-clear: #ff9ecb;
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: var(--app-height, 100%);
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Nunito', sans-serif;
    color: var(--text-main);
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: var(--app-height, 100vh);
  }

  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background: var(--panel-bg);
    backdrop-filter: blur(2px);
    z-index: 10;
  }
  #volumeScreen, #pauseScreen { z-index: 30; }

  .hidden { display: none !important; }

  h1.logo {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 3.2rem);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
    color: var(--star-gold);
    text-shadow: 0 0 24px rgba(255, 216, 102, 0.45);
  }

  p.tagline {
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    color: var(--text-dim);
    margin: 0 0 32px;
    max-width: 32ch;
    line-height: 1.6;
  }

  .btn {
    touch-action: manipulation;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--bg-deep);
    background: var(--star-gold);
    border: none;
    border-radius: 999px;
    padding: 16px 48px;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--ember-dark), 0 10px 20px rgba(0,0,0,0.35);
    transition: transform 0.08s ease;
  }
  .btn:active {
    box-shadow: 0 2px 0 var(--ember-dark), 0 4px 10px rgba(0,0,0,0.3);
  }

  .howto {
    margin-top: 28px;
    font-size: 0.9rem;
    color: var(--text-dim);
  }

  .result-score {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-weight: 800;
    color: var(--creature);
    margin: 8px 0 4px;
  }

  .result-label {
    font-size: 0.95rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
  }

  #scoreBox {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--text-main);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  #comboBox {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(0.9rem, 2.6vw, 1.15rem);
    color: var(--star-gold);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #comboBox.show { opacity: 1; }

  .touch-hint {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    pointer-events: none;
    opacity: 0.8;
  }

  #topCornerControls {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    display: flex;
    gap: 8px;
    z-index: 40;
    padding: 5px;
    border-radius: 999px;
    background: rgba(10,14,39,0.35);
  }
  #muteBtn, #pauseBtn, #volumeBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(20,26,61,0.7);
    color: var(--text-main);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    background: transparent;
    touch-action: none;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
  }
  input[type="range"]::-moz-range-track {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--star-gold);
    border: 2px solid #0a0e27;
    margin-top: -9px;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--star-gold);
    border: 2px solid #0a0e27;
    cursor: pointer;
  }

  @media (min-width: 720px) {
    .touch-hint { display: none; }
  }
  .title-menu-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 74px;
    padding: 10px 12px;
    border-radius: 16px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: var(--text-main);
    font-size: 1.25rem;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s, transform 0.1s;
  }
  .title-menu-btn span {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-weight: 700;
  }
  .title-menu-btn:hover { background: rgba(255,255,255,0.16); }
  .title-menu-btn:active { transform: scale(0.94); }

  @keyframes vnPop {
    from { transform: scale(0.9); opacity: 0.4; }
    to { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="topCornerControls">
    <button id="pauseBtn" title="一時停止" class="hidden">⏸</button>
    <button id="volumeBtn" title="音量設定">⚙</button>
    <button id="muteBtn" title="音のON/OFF">🔊</button>
  </div>

  <div class="overlay hidden" id="volumeScreen">
    <div class="result-label">音量設定</div>
    <div style="display:flex; flex-direction:column; gap:20px; margin:24px 0; width:min(320px, 80vw);">
      <label style="text-align:left; font-size:0.95rem;">
        BGM
        <input type="range" id="bgmVolSlider" min="0" max="100" style="width:100%; margin-top:6px;">
      </label>
      <label style="text-align:left; font-size:0.95rem;">
        効果音（SE）
        <input type="range" id="seVolSlider" min="0" max="100" style="width:100%; margin-top:6px;">
      </label>
    </div>
    <p class="howto"><a href="#" id="volumeBackLink" style="color:var(--text-dim);">もどる</a></p>
  </div>

  <div id="hud" class="hidden">
    <div id="roundBox" style="font-size:0.85rem; color:var(--text-dim); letter-spacing:0.05em;">ラウンド 1</div>
    <div id="scoreBox">0</div>
    <div id="comboBox">x1.0 コンボ</div>
  </div>
  <div class="touch-hint hidden" id="touchHint">画面の左右をタップして移動</div>

  <div id="heldItemBox" class="hidden" style="position:absolute; bottom:64px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:15; pointer-events:none;">
    <div id="heldItemDesc" style="background:rgba(10,14,39,0.75); color:var(--text-main); font-size:0.72rem; padding:4px 10px; border-radius:999px; white-space:nowrap; max-width:80vw; overflow:hidden; text-overflow:ellipsis;"></div>
    <div style="position:relative; pointer-events:auto;">
      <button id="useItemBtn" title="使う" style="width:56px;height:56px;border-radius:50%;border:3px solid var(--star-gold);
        cursor:pointer;touch-action:manipulation;font-size:22px;display:flex;align-items:center;justify-content:center;color:#0a0e27;"></button>
      <button id="discardItemBtn" title="すてる" style="position:absolute; top:-8px; right:-8px; width:22px;height:22px;
        border-radius:50%;background:rgba(10,14,39,0.9);color:var(--text-main);border:2px solid var(--bg-deep);
        font-size:12px;line-height:1;cursor:pointer;touch-action:manipulation;">×</button>
    </div>
  </div>

  <div class="overlay" id="titleScreen">
    <h1 class="logo">星降る夜をこえて</h1>
    <p class="tagline">夜空を渡る小さな生き物になって、降ってくる隕石をよけ続けよう。</p>
    <div class="result-label" id="titleBestLabel" style="display:none;">自己ベスト</div>
    <div class="result-score" id="titleBestScore" style="display:none; font-size:1.6rem; margin-bottom:20px;">0</div>
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button id="modeNormalBtn" style="padding:8px 18px; border-radius:999px; border:2px solid var(--star-gold); background:var(--star-gold); color:var(--bg-deep); font-weight:700; cursor:pointer; touch-action:manipulation;">ノーマル</button>
      <button id="modeEasyBtn" style="padding:8px 18px; border-radius:999px; border:2px solid var(--text-dim); background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer; touch-action:manipulation;">やさしい</button>
    </div>
    <button class="btn" id="startBtn">あそぶ</button>
    <p class="howto">← → キーで移動（スマホは画面タップ）</p>
    <div id="titleMenuRow" style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; max-width:360px;">
      <button class="title-menu-btn" id="tutorialOpenLink">❓<span>遊び方</span></button>
      <button class="title-menu-btn" id="skinOpenLink">🎨<span>スキン</span></button>
      <button class="title-menu-btn" id="achOpenLink">🏅<span>実績</span></button>
      <button class="title-menu-btn" id="storyOpenLink">📖<span>物語</span></button>
      <button class="title-menu-btn" id="charaOpenLink">✨<span>キャラクター</span></button>
    </div>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="result-label">一時停止中</div>
    <div style="display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="resumeBtn">再開する</button>
      <button class="btn" id="pauseTitleBtn" style="background:var(--creature); box-shadow:0 8px 0 #6fa8c9, 0 10px 20px rgba(0,0,0,0.35);">タイトルへ戻る</button>
    </div>
  </div>

  <div class="overlay hidden" id="achScreen">
    <div class="result-label">実績</div>
    <div id="achList" style="display:flex; flex-direction:column; gap:10px; margin:20px 0; max-width:420px; max-height:50vh; overflow-y:auto; padding:4px;"></div>
    <p class="howto"><a href="#" id="achBackLink" style="color:var(--text-dim);">もどる</a></p>
  </div>

  <div class="overlay hidden" id="storyScreen">
    <div class="result-label" id="storyScreenTitle">物語</div>
    <div id="storyList" style="display:flex; flex-direction:column; gap:10px; margin:20px 0; max-width:460px; max-height:50vh; overflow-y:auto; padding:4px;"></div>
    <p class="howto"><a href="#" id="storyBackLink" style="color:var(--text-dim);">もどる</a></p>
  </div>

  <div class="overlay hidden" id="charaScreen">
    <div class="result-label">キャラクター</div>
    <div id="charaList" style="display:flex; flex-direction:column; gap:16px; margin:20px 0; max-width:480px; max-height:60vh; overflow-y:auto; padding:4px;"></div>
    <p class="howto"><a href="#" id="charaBackLink" style="color:var(--text-dim);">もどる</a></p>
  </div>

  <div class="overlay hidden" id="tutorialScreen">
    <div class="result-label">遊び方</div>
    <div id="tutorialList" style="display:flex; flex-direction:column; gap:14px; margin:20px 0; max-width:480px; max-height:62vh; overflow-y:auto; padding:4px; text-align:left;"></div>
    <p class="howto"><a href="#" id="tutorialBackLink" style="color:var(--text-dim);">もどる</a></p>
  </div>

  <div class="hidden" id="vnScreen" style="position:fixed; inset:0; background:linear-gradient(180deg, #141a3d 0%, #0a0e27 60%); z-index:60; display:flex; flex-direction:column; overflow:hidden;">
    <div id="vnStars" style="position:absolute; inset:0; pointer-events:none;"></div>
    <button id="vnCloseBtn" title="とじる" style="position:absolute; top:14px; right:14px; z-index:2; width:38px; height:38px; border-radius:50%; border:none; background:rgba(20,26,61,0.8); color:var(--text-main); font-size:1.1rem; cursor:pointer; touch-action:manipulation;">×</button>
    <div id="vnChapterLabel" style="position:absolute; top:16px; left:18px; font-size:0.85rem; color:var(--text-dim); letter-spacing:0.04em;"></div>
    <div id="vnPortraitArea" style="flex:1; position:relative; display:flex; align-items:flex-end; justify-content:center; gap:24px; padding-bottom:12px; cursor:pointer;"></div>
    <div id="vnDialogueBox" style="background:rgba(10,14,39,0.94); border-top:3px solid var(--star-gold); padding:18px 22px 24px; min-height:110px; cursor:pointer;">
      <div id="vnSpeakerName" style="font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--star-gold); margin-bottom:6px; font-size:1.05rem;"></div>
      <div id="vnText" style="font-size:1rem; line-height:1.7; color:var(--text-main);"></div>
      <div id="vnNextHint" style="text-align:right; margin-top:10px; font-size:0.78rem; color:var(--text-dim);">タップして次へ ▶</div>
    </div>
    <audio id="vnBgmPlayer" loop></audio>
  </div>
  <audio id="mainBgmPlayer" loop></audio>

  <div class="overlay hidden" id="skinScreen">
    <div class="result-label">スキンを選ぶ</div>
    <div id="skinList" style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:20px 0; max-width:420px;"></div>
    <div id="skinPreviewBox" style="display:flex; flex-direction:column; align-items:center; gap:6px; margin:4px 0 14px;">
      <canvas id="skinPreviewCanvas" width="140" height="150" style="width:120px; height:auto;"></canvas>
      <div id="skinPreviewName" style="font-weight:800; color:var(--star-gold); font-size:1rem;"></div>
      <div id="skinPreviewDesc" style="font-size:0.82rem; color:var(--text-dim); max-width:320px; line-height:1.5;"></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; justify-content:center;">
      <input id="codeInput" type="text" placeholder="コードを入力" autocomplete="off"
        style="padding:10px 14px; border-radius:999px; border:none; font-family:'Nunito',sans-serif; font-size:0.95rem; width:180px;">
      <button class="btn" id="redeemBtn" style="padding:10px 24px; font-size:0.95rem;">解放</button>
    </div>
    <p class="howto" id="codeStatus" style="min-height:1.2em;"></p>
    <p class="howto"><a href="#" id="skinBackLink" style="color:var(--text-dim);">もどる</a></p>
  </div>

  <div class="overlay hidden" id="resultScreen">
    <div class="result-label" id="newBestLabel" style="display:none; color:var(--star-gold);">自己ベスト更新！</div>
    <div class="result-label">SCORE</div>
    <div class="result-score" id="finalScore">0</div>
    <div class="howto" id="bestScoreLine">自己ベスト：0</div>
    <div class="howto" id="newSkinLine" style="color:var(--star-gold); display:none;"></div>
    <div class="howto" id="newAchLine" style="color:#9be8ff; display:none;"></div>
    <div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="retryBtn">もう一度</button>
      <button class="btn" id="shareBtn" style="background:var(--creature); box-shadow:0 8px 0 #6fa8c9, 0 10px 20px rgba(0,0,0,0.35);">結果をコピー</button>
    </div>
    <p class="howto" id="shareStatus" style="min-height:1.2em;"></p>
    <p class="howto"><a href="#" id="titleLink" style="color:var(--text-dim);">タイトルへ戻る</a></p>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const titleScreen = document.getElementById('titleScreen');
  const resultScreen = document.getElementById('resultScreen');
  const hud = document.getElementById('hud');
  const scoreBox = document.getElementById('scoreBox');
  const roundBox = document.getElementById('roundBox');
  const comboBox = document.getElementById('comboBox');
  const finalScoreEl = document.getElementById('finalScore');
  const touchHint = document.getElementById('touchHint');
  const titleBestLabel = document.getElementById('titleBestLabel');
  const titleBestScore = document.getElementById('titleBestScore');
  const newBestLabel = document.getElementById('newBestLabel');
  const bestScoreLine = document.getElementById('bestScoreLine');
  const shareBtn = document.getElementById('shareBtn');
  const shareStatus = document.getElementById('shareStatus');

  const BEST_SCORE_KEY = 'dodge_game_best_score';
  function loadBestScore() {
    const v = parseInt(localStorage.getItem(BEST_SCORE_KEY) || '0', 10);
    return Number.isFinite(v) ? v : 0;
  }
  function saveBestScore(v) {
    try { localStorage.setItem(BEST_SCORE_KEY, String(v)); } catch (e) { /* storage unavailable */ }
  }
  function refreshTitleBest() {
    const best = loadBestScore();
    if (best > 0) {
      titleBestLabel.style.display = '';
      titleBestScore.style.display = '';
      titleBestScore.textContent = best;
    }
  }
  refreshTitleBest();

  // ---- Code-unlockable skins (Phase 4) ----
  // NOTE: CODE_TO_SKIN is a placeholder mapping for development/testing.
  // Real codes for Discord subscriber perks / events will replace these before launch.
  const SKINS = [
    { id: 'default',   name: 'まんまる',   body: '#bfe6ff', cheek: '#ffc2d1', unlockedByDefault: true, desc: 'いつもの、まんまるな姿。' },
    { id: 'gold',       name: 'きらぼし',   body: '#ffe29a', cheek: '#ffb347', unlockScore: 500, desc: 'スコア500点以上で解放される、金色の輝き。' },
    { id: 'lavender',   name: 'つきかげ',   body: '#d8c2ff', cheek: '#c2a6ff', unlockScore: 1500, desc: 'スコア1500点以上で解放される、月夜のような紫。' },
    { id: 'aurora',     name: 'オーロラ',   body: '#7dffd1', cheek: '#4de8ff', accessory: 'trail', unlockPlays: 2, desc: '2回プレイすると解放される。動くたびに金色の光の粒が舞う。' },
    { id: 'ch1_skin', name: 'はじまりの一歩', body: '#bfe6ff', cheek: '#ffc2d1', accessory: 'hairpin', unlockChapter: 1, desc: '物語 第1章「光を集める理由」を読み終えると解放。頭に小さな星のヘアピンが付く。' },
    { id: 'ch2_skin', name: '星屑の探求者',   body: '#bfe6ff', cheek: '#ffc2d1', accessory: 'pendant', unlockChapter: 2, desc: '物語 第2章「朽ちていく光の正体」を読み終えると解放。胸元に隕石のかけら風のペンダントが付く。' },
    { id: 'ch3_skin', name: '寄り添う証',     body: '#bfe6ff', cheek: '#ffc2d1', accessory: 'ribbon', unlockChapter: 3, desc: '物語 第3章「ルミナの光が消える原因」を読み終えると解放。ルミナの髪色を思わせるリボンが付く。' },
    { id: 'ch4_skin', name: '継がれし想い',   body: '#bfe6ff', cheek: '#ffc2d1', accessory: 'cape', unlockChapter: 4, desc: '物語 第4章「星の守り手という存在」を読み終えると解放。肩にルミナのケープを思わせる小さなマントが付く。' },
    { id: 'ch5_skin', name: '絆の光冠',       body: '#bfe6ff', cheek: '#ffc2d1', accessory: 'crown', unlockChapter: 5, desc: '物語 第5章「光が守られた」を読み終えると解放。頭に小さな星の冠が付く。' },

  function portraitSVG(name, scale) {
    const s = scale || 1;
    const src = PORTRAIT_IMAGES[name];
    const baseW = name === 'ルミナ' ? 220 : 190;
    return `<img src="${src}" style="width:${baseW * s}px; height:auto; display:block; filter:drop-shadow(0 8px 18px rgba(0,0,0,0.5));">`;
  }

  let vnStory = null, vnLineIndex = 0, vnSpeakers = [];
  const vnScreen = document.getElementById('vnScreen');
  const vnPortraitArea = document.getElementById('vnPortraitArea');
  const vnBgmPlayer = document.getElementById('vnBgmPlayer');

  (function initVNStars() {
    const container = document.getElementById('vnStars');
    for (let i = 0; i < 40; i++) {
      const star = document.createElement('div');
      const size = 1 + Math.random() * 2;
      star.style.cssText = `position:absolute; left:${Math.random() * 100}%; top:${Math.random() * 100}%;
        width:${size}px; height:${size}px; border-radius:50%; background:#fff; opacity:${0.3 + Math.random() * 0.6};`;
      container.appendChild(star);
    }
  })();

  function openVN(story) {
    vnStory = story;
    vnLineIndex = 0;
    document.getElementById('vnChapterLabel').textContent = `第${story.chapter}章 第${story.order}話「${story.title}」`;
    document.getElementById('storyScreen').classList.add('hidden');
    vnScreen.classList.remove('hidden');

    mainBgmPlayer.pause();
    const track = BGM_TRACKS[story.bgmKey];
    if (track) {
      vnBgmPlayer.pause();
      vnBgmPlayer.currentTime = 0;
      vnBgmPlayer.src = track;
      vnBgmPlayer.load();
      vnBgmPlayer.volume = muted ? 0 : bgmVolume * 0.875;
      vnBgmPlayer.play().catch(() => {});
    } else {
      vnBgmPlayer.pause();
    }

    showVNLine();

  function drawSkinPreview(skin) {
    const canvas = document.getElementById('skinPreviewCanvas');
    if (!canvas) return;
    const p = canvas.getContext('2d');
    p.clearRect(0, 0, canvas.width, canvas.height);
    const R = 42;
    const cx = canvas.width / 2, cy = canvas.height / 2 + 14;
    const bellyColor = lightenColor(skin.body, 0.55);
    const footColor = lightenColor(skin.body, -0.15);
    p.save();
    p.translate(cx, cy);

    if (skin.accessory && skin.accessory !== 'trail') drawSkinAccessoryBehind(skin.accessory, p, R);

    p.fillStyle = skin.body;
    p.strokeStyle = footColor;
    p.lineWidth = 2;
    [-1, 1].forEach(side => {
      p.beginPath();
      p.ellipse(side * R * 0.48, R * 0.95, R * 0.19, R * 0.17, 0, 0, Math.PI * 2);
      p.fill(); p.stroke();
    });

    p.fillStyle = skin.body;
    p.beginPath();
    p.arc(-R * 0.68, -R * 0.65, R * 0.27, 0, Math.PI * 2);
    p.arc(R * 0.68, -R * 0.65, R * 0.27, 0, Math.PI * 2);
    p.fill();

    p.beginPath();
    p.arc(0, 0, R, 0, Math.PI * 2);
    p.fill();

    p.save();
    p.beginPath();
    p.arc(0, 0, R, 0, Math.PI * 2);
    p.clip();
    p.fillStyle = bellyColor;
    p.beginPath();
    p.ellipse(0, R * 0.7, R * 0.97, R * 0.72, 0, 0, Math.PI * 2);
    p.fill();
    p.restore();

    p.fillStyle = skin.body;
    p.beginPath();
    p.arc(-R * 0.92, R * 0.2, R * 0.155, 0, Math.PI * 2);
    p.arc(R * 0.92, R * 0.2, R * 0.155, 0, Math.PI * 2);
    p.fill();

    p.fillStyle = '#20304a';
    p.beginPath();
    p.ellipse(-R * 0.27, -R * 0.02, R * 0.1, R * 0.135, 0, 0, Math.PI * 2);
    p.ellipse(R * 0.27, -R * 0.02, R * 0.1, R * 0.135, 0, 0, Math.PI * 2);
    p.fill();
    p.fillStyle = '#ffffff';
    p.beginPath();
    p.arc(-R * 0.23, -R * 0.075, R * 0.028, 0, Math.PI * 2);
    p.arc(R * 0.31, -R * 0.075, R * 0.028, 0, Math.PI * 2);
    p.fill();

    p.fillStyle = skin.cheek;
    p.globalAlpha = 0.85;
    p.beginPath();
    p.arc(-R * 0.46, R * 0.28, R * 0.15, 0, Math.PI * 2);
    p.arc(R * 0.46, R * 0.28, R * 0.15, 0, Math.PI * 2);
    p.fill();
    p.globalAlpha = 1;

    p.strokeStyle = '#c9482c';
    p.lineWidth = Math.max(1.2, R * 0.035);
    p.lineCap = 'round';
    p.beginPath();
    p.moveTo(-R * 0.13, R * 0.27);
    p.quadraticCurveTo(0, R * 0.35, R * 0.13, R * 0.27);
    p.stroke();

    if (skin.accessory && skin.accessory !== 'trail') drawSkinAccessory(skin.accessory, p, R);

    p.restore();

    document.getElementById('skinPreviewName').textContent = skin.name;
    document.getElementById('skinPreviewDesc').textContent = skin.desc || '';
  }

  function initAudio() {
    if (audioCtx) {

    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : seVolume;
    masterGain.connect(audioCtx.destination);

  }

  function tone(freq, duration, { type = 'sine', gain = 0.28, delay = 0, slideTo = null } = {}) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  // Gentle looping ambient pad + slow arpeggio, evoking a quiet night sky
  const BGM_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00]; // C D E G A (pentatonic-ish)
  let bgmTimer = null, bgmStep = 0;
  function startBgm() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (!audioCtx) return;
      const note = BGM_SCALE[bgmStep % BGM_SCALE.length];
      bgmStep++;
      tone(note / 2, 1.4, { type: 'sine', gain: 0.05 });
      if (bgmStep % 2 === 0) tone(note, 0.8, { type: 'triangle', gain: 0.035, delay: 0.4 });
    }, 900);
  }
  const BASE_SPAWN_INTERVAL = 1.2;
  const MIN_SPAWN_INTERVAL = 0.5;
  const BASE_FALL_SPEED = 200;
  const MAX_FALL_SPEED = 500;
  const RAMP_STEP_SEC = 15;
  const RAMP_INTERVAL_MULT = 0.95;
  const RAMP_SPEED_MULT = 1.08;
  const RAMP_CAP_SEC = 120;

  const DIFFICULTY_PRESETS = {
    normal: { rampRate: 1,   speedMult: 1,   intervalMult: 1 },
    easy:   { rampRate: 0.6, speedMult: 0.8, intervalMult: 1.25 }
  };

  function currentDifficulty(elapsed) {
    const preset = DIFFICULTY_PRESETS[difficultyMode] || DIFFICULTY_PRESETS.normal;
    const effElapsed = elapsed * preset.rampRate;
    const steps = Math.min(Math.floor(effElapsed / RAMP_STEP_SEC), Math.floor(RAMP_CAP_SEC / RAMP_STEP_SEC));
    let interval = BASE_SPAWN_INTERVAL * Math.pow(RAMP_INTERVAL_MULT, steps) * preset.intervalMult;
    let speed = BASE_FALL_SPEED * Math.pow(RAMP_SPEED_MULT, steps) * preset.speedMult;
    interval = Math.max(interval, MIN_SPAWN_INTERVAL);
    speed = Math.min(speed, MAX_FALL_SPEED);
    return { interval, speed };
  }

  // ---- Power-up definitions ----
  const POWERUP_TYPES = [
    { key: 'slow',      weight: 25, color: 'var(--pu-slow)',  hex: '#5ee6c4', duration: 5  },
    { key: 'score',     weight: 20, color: 'var(--pu-score)', hex: '#ffcb3d', duration: 10 },
    { key: 'shield',    weight: 15, color: 'var(--pu-shield)',hex: '#7fffd4', duration: 3  },
    { key: 'clear',     weight: 12, color: 'var(--pu-clear)', hex: '#ff9ecb', duration: 0  },
    { key: 'shrink',    weight: 14, color: '#e0b3ff',         hex: '#e0b3ff', duration: 6  },
    { key: 'magnet',    weight: 14, color: '#ff8fa3',         hex: '#ff8fa3', duration: 6  }
  ];
  const POWERUP_TOTAL_WEIGHT = POWERUP_TYPES.reduce((s, p) => s + p.weight, 0);

  function pickPowerupType() {
    let r = Math.random() * POWERUP_TOTAL_WEIGHT;
    for (const p of POWERUP_TYPES) {
      if (r < p.weight) return p;
      r -= p.weight;
    }
    return POWERUP_TYPES[0];
  }

  // ---- Status-ailment hazards: touching one applies a temporary debuff instead of ending the run ----
  const AILMENT_TYPES = [
    { key: 'slow',    weight: 34, hex: '#8a6fae', duration: 5 },
    { key: 'confuse', weight: 33, hex: '#6f5a9c', duration: 5 },
    { key: 'blur',    weight: 33, hex: '#5c4a80', duration: 4 }
  ];
  const AILMENT_TOTAL_WEIGHT = AILMENT_TYPES.reduce((s, a) => s + a.weight, 0);
  function pickAilmentType() {
    let r = Math.random() * AILMENT_TOTAL_WEIGHT;
    for (const a of AILMENT_TYPES) {
      if (r < a.weight) return a;
      r -= a.weight;
    }
    return AILMENT_TYPES[0];
  }

  // ---- Game state ----
  let state = 'title';
  let player, meteors, powerups, particles, popups, lightOrbs, ailments;
  let elapsed, spawnTimer, powerupTimer, lightOrbTimer, ailmentTimer, score, lastTime;
  let combo, effects;
  let heldPowerup = null;
  let prePauseState = 'playing';

  const NEAR_MISS_MARGIN = 15;
  const LIGHT_ORB_SCORE = 30;

  const ROUND_LENGTH = 30;          // seconds of active play per round
  const ROUND_BREAK_DURATION = 1.8; // seconds paused at each round boundary
  let round, roundBreakTimer, roundLine;
  let lightOrbCountThisPlay = 0, shieldSaveCountThisPlay = 0, roundHadAilmentHit = false;
  let trailTimer = 0;
  let starFootMarks = [], starFootTimer = 0, starFootSide = 1;

    if (finalScore >= 3000 && unlockAchievement('score3000')) newlyUnlockedAch.push('輝きの担い手');
    if (finalScore >= 5000 && unlockAchievement('score5000')) newlyUnlockedAch.push('星々の希望');
    if (finalScore >= 8000 && unlockAchievement('score8000')) newlyUnlockedAch.push('星の守護者');

  // ---- Input ----
  const keys = { left: false, right: false };
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (state === 'playing' || state === 'roundBreak') {
        prePauseState = state;
        state = 'paused';
        pauseScreen.classList.remove('hidden');
      } else if (state === 'paused') {
        pauseScreen.classList.add('hidden');
        lastTime = null;
        state = prePauseState;
      }
    }
    if (state === 'playing' && (e.key === ' ' || e.key === 'Spacebar')) {
      e.preventDefault();
      if (heldPowerup) {
        const type = heldPowerup;
        heldPowerup = null;
        updateHeldUI();
        applyPowerup(type);
      }
    }
    if (state === 'playing' && (e.key === 'x' || e.key === 'X')) {

        updateHeldUI();

    }
  });
  window.addEventListener('keyup', (e) => {

  let touchLeft = false, touchRight = false;
  canvas.addEventListener('pointerdown', (e) => {

  });
  canvas.addEventListener('pointerup', (e) => { e.preventDefault(); touchLeft = false; touchRight = false; });
  canvas.addEventListener('pointercancel', (e) => { e.preventDefault(); touchLeft = false; touchRight = false; });

  function bindTap(el, handler) {
    let lastFired = 0;
    const fire = (e) => {
      const now = Date.now();
      if (now - lastFired < 400) return;
      lastFired = now;
      initAudio();
      handler(e);
    };
    el.addEventListener('click', fire);
    el.addEventListener('pointerup', fire);
    el.addEventListener('touchend', fire);
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      fire(e);
    }, { passive: false });
  }

  bindTap(document.getElementById('startBtn'), startGame);
  bindTap(document.getElementById('retryBtn'), startGame);
  bindTap(document.getElementById('titleLink'), (e) => {

  });
  bindTap(shareBtn, async () => {
    const text = `星降る夜をこえてでスコア${finalScoreEl.textContent}点！\n${location.href}`;
    try {
      await navigator.clipboard.writeText(text);

    } catch (e) {
      shareStatus.textContent = 'コピーできませんでした（手動で選択してください）';
    }
  });

  // ---- Meteor variety (unlocks progressively as elapsed time increases) ----
  const METEOR_TYPES = [
    { key: 'normal', unlockAt: 0,  weight: 60, sizeMult: 1.0, speedMult: 1.0, body: '#c9482c', trail: '255,122,82', behavior: 'straight' },
    { key: 'comet',  unlockAt: 20, weight: 20, sizeMult: 0.65, speedMult: 1.6, body: '#8fd9ff', trail: '160,230,255', behavior: 'straight' },
    { key: 'zigzag', unlockAt: 40, weight: 20, sizeMult: 0.85, speedMult: 0.95, body: '#c48bff', trail: '210,150,255', behavior: 'zigzag' },
    { key: 'giant',  unlockAt: 60, weight: 12, sizeMult: 1.6,  speedMult: 0.6,  body: '#a33322', trail: '255,90,60',  behavior: 'straight' },
    { key: 'stealth', unlockAt: 80, weight: 14, sizeMult: 0.9, speedMult: 1.1, body: '#5a5a72', trail: '150,150,180', behavior: 'stealth' },
    { key: 'homing',  unlockAt: 100, weight: 12, sizeMult: 0.8, speedMult: 0.85, body: '#3fae7a', trail: '120,220,170', behavior: 'homing' },
    { key: 'twin',    unlockAt: 120, weight: 10, sizeMult: 0.6, speedMult: 1.0, body: '#d9a233', trail: '255,210,120', behavior: 'twin' }
  ];
  function pickMeteorType(elapsed) {
    const available = METEOR_TYPES.filter(t => elapsed >= t.unlockAt);
    const total = available.reduce((s, t) => s + t.weight, 0);
    let r = Math.random() * total;
    for (const t of available) {
      if (r < t.weight) return t;
      r -= t.weight;
    }
    return available[0];
  }

  // ---- Starfield background ----
  const stars = Array.from({ length: 80 }, () => ({
    x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + 0.4, tw: Math.random() * Math.PI * 2,
    speed: 0.015 + Math.random() * 0.025
  }));

  function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }
  function lerpColor(c1, c2, t, a = 1) {
    return `rgba(${lerpChannel(c1[0], c2[0], t)},${lerpChannel(c1[1], c2[1], t)},${lerpChannel(c1[2], c2[2], t)},${a})`;
  }
  const ZONE_ROUND_SPAN = 3; // rounds per background zone transition — several rounds, not every round
  const ZONE_COLORS = [
    [20, 26, 61],  // navy (start)
    [46, 20, 66],  // violet nebula belt
    [18, 42, 52],  // deep teal drift
    [58, 22, 42]   // wine-red drift
  ];
  const ZONE_LINES = [
    ['静かな夜空を、そっと飛び立つ', '星の光を探して、旅がはじまる'],
    ['紫の霧の中、かすかな光を追う', 'ネビュラの帯を抜けていく'],
    ['深い青緑の海のような空を渡る', '静寂の中、星の光の気配を感じる'],
    ['紅く燃える星々のそばを進む', '故郷の光まで、もう少し']
  ];
  function getZoneLine(r) {
    const zoneGroup = Math.floor((r - 1) / ZONE_ROUND_SPAN);
    const zoneIndex = zoneGroup % ZONE_LINES.length;
    const variants = ZONE_LINES[zoneIndex];
    const variantIndex = Math.floor(zoneGroup / ZONE_LINES.length) % variants.length;
    return variants[variantIndex];
  }
  const nebulaBlobs = [
    { rx: 0.22, ry: 0.28, r: 0.32, hue: '150,90,220' },
    { rx: 0.78, ry: 0.62, r: 0.28, hue: '90,140,255' },
    { rx: 0.5,  ry: 0.85, r: 0.24, hue: '220,110,180' }
  ];

  function drawBackground(dt, elapsedForZone) {
    const e = elapsedForZone || 0;
    const journey = e / (ZONE_ROUND_SPAN * ROUND_LENGTH); // continuous "how many zone-groups traveled"
    const zoneIndex = Math.floor(journey) % ZONE_COLORS.length;
    const nextZoneIndex = (zoneIndex + 1) % ZONE_COLORS.length;
    const localT = journey - Math.floor(journey);
    const topColor = lerpColor(ZONE_COLORS[zoneIndex], ZONE_COLORS[nextZoneIndex], localT, 0.9);
    const nebulaIntensity = Math.min(1, journey / 2); // deepens over ~2 zone cycles, then holds

    ctx.fillStyle = '#0a0e27';
    ctx.fillRect(0, 0, width, height);

    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, 'rgba(10,14,39,0.2)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    if (nebulaIntensity > 0.02) {
      for (const b of nebulaBlobs) {
        const cx = b.rx * width, cy = b.ry * height, r = b.r * Math.max(width, height);
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `rgba(${b.hue},${(0.16 * nebulaIntensity).toFixed(3)})`);
        g.addColorStop(1, `rgba(${b.hue},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const s of stars) {
      s.tw += dt * 2;
      s.y += s.speed * dt;
      if (s.y > 1.02) { s.y = -0.02; s.x = Math.random(); }
      const alpha = 0.5 + Math.sin(s.tw) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${(0.3 + alpha * 0.7).toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function lightenColor(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const mix = (c) => Math.max(0, Math.min(255, Math.round(c + (255 - c) * amt)));
    const darken = (c) => Math.max(0, Math.min(255, Math.round(c * (1 + amt))));
    r = amt >= 0 ? mix(r) : darken(r);
    g = amt >= 0 ? mix(g) : darken(g);
    b = amt >= 0 ? mix(b) : darken(b);
    return `rgb(${r},${g},${b})`;
  }

  function drawPlayer(shielded, shrunk) {
    const y = height - 90;
    let restoreBody = null, restoreCheek = null;
    if (currentSkin.accessory === 'rainbow') {
      restoreBody = currentSkin.body; restoreCheek = currentSkin.cheek;
      const hue = (elapsed * 70) % 360;
      currentSkin.body = `hsl(${hue}, 88%, 74%)`;
      currentSkin.cheek = `hsl(${(hue + 40) % 360}, 90%, 80%)`;
    }
    const bellyColor = lightenColor(currentSkin.body, 0.55);
    const footColor = lightenColor(currentSkin.body, -0.15);
    ctx.save();
    ctx.translate(player.x, y);
    if (shrunk) ctx.scale(0.72, 0.72);

    if (shielded) {
      ctx.strokeStyle = 'rgba(182,255,176,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS * 1.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (currentSkin.accessory === 'rainbow') {
      const hue = (elapsed * 70) % 360;
      const aura = ctx.createRadialGradient(0, 0, 4, 0, 0, PLAYER_RADIUS * 2.8);
      aura.addColorStop(0, `hsla(${hue}, 90%, 70%, 0.55)`);
      aura.addColorStop(1, `hsla(${hue}, 90%, 70%, 0)`);
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS * 2.8, 0, Math.PI * 2);
      ctx.fill();
    }

    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, PLAYER_RADIUS * 2.2);
    glow.addColorStop(0, 'rgba(191,230,255,0.35)');
    glow.addColorStop(1, 'rgba(191,230,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_RADIUS * 2.2, 0, Math.PI * 2);
    ctx.fill();

    if (currentSkin.subExclusive) drawSubAura(ctx, PLAYER_RADIUS, elapsed);

    if (currentSkin.accessory === 'veil') drawVeilEffect(ctx, PLAYER_RADIUS, elapsed);

    drawSkinAccessoryBehind(currentSkin.accessory);

    // feet, drawn first so the body overlaps their tops
    ctx.fillStyle = currentSkin.body;
    ctx.strokeStyle = footColor;
    ctx.lineWidth = 2;
    [-1, 1].forEach(side => {
      ctx.beginPath();
      ctx.ellipse(side * PLAYER_RADIUS * 0.48, PLAYER_RADIUS * 0.95, PLAYER_RADIUS * 0.19, PLAYER_RADIUS * 0.17, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    });

    // ears
    ctx.fillStyle = currentSkin.body;
    ctx.beginPath();
    ctx.arc(-PLAYER_RADIUS * 0.68, -PLAYER_RADIUS * 0.65, PLAYER_RADIUS * 0.27, 0, Math.PI * 2);
    ctx.arc(PLAYER_RADIUS * 0.68, -PLAYER_RADIUS * 0.65, PLAYER_RADIUS * 0.27, 0, Math.PI * 2);
    ctx.fill();

    // main body
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // two-tone belly, clipped to the body circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = bellyColor;
    ctx.beginPath();
    ctx.ellipse(0, PLAYER_RADIUS * 0.7, PLAYER_RADIUS * 0.97, PLAYER_RADIUS * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // tiny stub arms
    ctx.fillStyle = currentSkin.body;
    ctx.beginPath();
    ctx.arc(-PLAYER_RADIUS * 0.92, PLAYER_RADIUS * 0.2, PLAYER_RADIUS * 0.155, 0, Math.PI * 2);
    ctx.arc(PLAYER_RADIUS * 0.92, PLAYER_RADIUS * 0.2, PLAYER_RADIUS * 0.155, 0, Math.PI * 2);
    ctx.fill();

    // eyes: approved navy-oval + highlight style
    ctx.fillStyle = '#20304a';
    ctx.beginPath();
    ctx.ellipse(-PLAYER_RADIUS * 0.27, -PLAYER_RADIUS * 0.02, PLAYER_RADIUS * 0.1, PLAYER_RADIUS * 0.135, 0, 0, Math.PI * 2);
    ctx.ellipse(PLAYER_RADIUS * 0.27, -PLAYER_RADIUS * 0.02, PLAYER_RADIUS * 0.1, PLAYER_RADIUS * 0.135, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-PLAYER_RADIUS * 0.23, -PLAYER_RADIUS * 0.075, PLAYER_RADIUS * 0.028, 0, Math.PI * 2);
    ctx.arc(PLAYER_RADIUS * 0.31, -PLAYER_RADIUS * 0.075, PLAYER_RADIUS * 0.028, 0, Math.PI * 2);
    ctx.fill();

    // cheeks
    ctx.fillStyle = currentSkin.cheek;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(-PLAYER_RADIUS * 0.46, PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.15, 0, Math.PI * 2);
    ctx.arc(PLAYER_RADIUS * 0.46, PLAYER_RADIUS * 0.28, PLAYER_RADIUS * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // mouth
    ctx.strokeStyle = '#c9482c';
    ctx.lineWidth = Math.max(1.5, PLAYER_RADIUS * 0.035);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-PLAYER_RADIUS * 0.13, PLAYER_RADIUS * 0.27);
    ctx.quadraticCurveTo(0, PLAYER_RADIUS * 0.35, PLAYER_RADIUS * 0.13, PLAYER_RADIUS * 0.27);
    ctx.stroke();

    drawSkinAccessory(currentSkin.accessory);
    if (currentSkin.accessory === 'companion') drawCompanionEffect(ctx, PLAYER_RADIUS, elapsed);

    ctx.restore();

    if (restoreBody !== null) { currentSkin.body = restoreBody; currentSkin.cheek = restoreCheek; }
  }

  function drawSubAura(c, R, t) {
    c.save();
    const pulse = 1 + Math.sin(t * 2.4) * 0.06;
    const ring = c.createRadialGradient(0, 0, R * 0.9, 0, 0, R * 1.5 * pulse);
    ring.addColorStop(0, 'rgba(255,246,200,0)');
    ring.addColorStop(0.7, 'rgba(255,246,200,0.22)');
    ring.addColorStop(1, 'rgba(255,246,200,0)');
    c.fillStyle = ring;
    c.beginPath();
    c.arc(0, 0, R * 1.5 * pulse, 0, Math.PI * 2);
    c.fill();

    for (let i = 0; i < 10; i++) {
      const seed = i * 7.3;
      const ang = seed + t * 0.5;
      const dist = R * (1.05 + 0.35 * Math.sin(seed * 1.7));
      const tx = Math.cos(ang) * dist, ty = Math.sin(ang) * dist * 0.7;
      const twinkle = Math.max(0, Math.sin(t * 4 + seed * 3));
      if (twinkle < 0.4) continue;
      c.fillStyle = `rgba(255,255,255,${twinkle * 0.9})`;
      const s = R * 0.028 * twinkle;
      c.beginPath();
      c.moveTo(tx, ty - s); c.lineTo(tx + s, ty); c.lineTo(tx, ty + s); c.lineTo(tx - s, ty);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawVeilEffect(c, R, t) {
    c.save();
    // layered translucent fabric bands that drape and sway around the body, like a veil caught in a slow breeze
    for (let i = 0; i < 3; i++) {
      const wave = Math.sin(t * 1.3 + i * 1.4) * R * 0.15;
      const wave2 = Math.sin(t * 1.3 + i * 1.4 + 1.2) * R * 0.1;
      const hue = (t * 22 + i * 45) % 360;
      const spread = R * (1.25 + i * 0.28);
      c.fillStyle = `hsla(${hue}, 80%, 82%, ${0.24 - i * 0.05})`;
      c.beginPath();
      c.moveTo(-spread, -R * 0.15 + wave);
      c.quadraticCurveTo(0, spread * 1.15 + wave2, spread, -R * 0.15 - wave);
      c.quadraticCurveTo(0, spread * 0.68, -spread, -R * 0.15 + wave);
      c.closePath();
      c.fill();
    }
    // energetic swirling gust of stardust, bursting outward and up rather than gently drifting
    for (let i = 0; i < 16; i++) {
      const seed = i * 9.7;
      const cycle = 1.6 + (i % 3) * 0.3;
      const phase = ((t + seed) % cycle) / cycle;
      const swirl = seed + t * 2.2;
      const burstR = R * (0.3 + phase * 2.2);
      const fx = Math.cos(swirl) * burstR;
      const fy = Math.sin(swirl) * burstR * 0.6 - phase * R * 1.6;
      const alpha = Math.sin(phase * Math.PI);
      const size = R * (0.03 + 0.05 * Math.sin(seed * 3));
      const hue = (t * 30 + seed * 20) % 360;
      c.fillStyle = `hsla(${hue}, 95%, 85%, ${0.85 * alpha})`;
      c.beginPath();
      c.arc(fx, fy, Math.max(0.5, size), 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }

  function drawCompanionEffect(c, R, t) {
    c.save();
    for (let i = 0; i < 3; i++) {
      const speed = 1.2 + i * 0.35;
      const orbitR = R * (1.9 + i * 0.5);
      const ang = t * speed + (i / 3) * Math.PI * 2;
      const sx = Math.cos(ang) * orbitR;
      const sy = Math.sin(ang) * orbitR * 0.4 - R * 0.3;
      const s = R * (0.16 - i * 0.02);

      const trailAng = ang - 0.35;
      const tx = Math.cos(trailAng) * orbitR, ty = Math.sin(trailAng) * orbitR * 0.4 - R * 0.3;
      c.strokeStyle = 'rgba(255,230,140,0.5)';
      c.lineWidth = Math.max(1, R * 0.03);
      c.beginPath();
      c.moveTo(tx, ty); c.lineTo(sx, sy);
      c.stroke();

      c.fillStyle = '#fff2b0';
      c.beginPath();
      c.moveTo(sx, sy - s); c.lineTo(sx + s * 0.6, sy); c.lineTo(sx, sy + s); c.lineTo(sx - s * 0.6, sy);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawSkinAccessory(accessory, c, R) {
    if (!accessory) return;
    c = c || ctx;
    R = R || PLAYER_RADIUS;
    c.save();
    c.scale(1.6, 1.6);
    if (accessory === 'hairpin') {
      // large star hairpin above the right ear
      c.save();
      c.translate(R * 0.4, -R * 0.72);
      c.fillStyle = '#ffd866';
      c.strokeStyle = '#c9942f';
      c.lineWidth = Math.max(1, R * 0.02);
      c.beginPath();
      const spikes = 4, outerR = R * 0.26, innerR = R * 0.1;
      for (let i = 0; i < spikes * 2; i++) {
        const ang = (i / (spikes * 2)) * Math.PI * 2;
        const rad = i % 2 === 0 ? outerR : innerR;
        const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
      c.stroke();
      c.restore();
    } else if (accessory === 'pendant') {
      // meteor-fragment pendant, sitting just below the mouth
      c.save();
      c.strokeStyle = '#c9942f';
      c.lineWidth = Math.max(1.5, R * 0.045);
      c.beginPath();
      c.moveTo(0, R * 0.32); c.lineTo(0, R * 0.4);
      c.stroke();
      c.fillStyle = '#a86a52';
      c.strokeStyle = '#6b3f30';
      c.lineWidth = Math.max(1, R * 0.018);
      c.beginPath();
      c.moveTo(0, R * 0.38);
      c.lineTo(R * 0.14, R * 0.51);
      c.lineTo(0, R * 0.64);
      c.lineTo(-R * 0.14, R * 0.51);
      c.closePath();
      c.fill();
      c.stroke();
      c.restore();
    } else if (accessory === 'ribbon') {
      // large lavender ribbon on top of the head, echoing Luna's hair color
      c.save();
      c.translate(0, -R * 1.05);
      c.fillStyle = '#dcccf5';
      c.strokeStyle = '#b6a0e8';
      c.lineWidth = Math.max(1, R * 0.02);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-R * 0.42, -R * 0.26);
      c.lineTo(-R * 0.18, 0);
      c.lineTo(-R * 0.42, R * 0.26);
      c.closePath();
      c.fill(); c.stroke();
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(R * 0.42, -R * 0.26);
      c.lineTo(R * 0.18, 0);
      c.lineTo(R * 0.42, R * 0.26);
      c.closePath();
      c.fill(); c.stroke();
      c.beginPath();
      c.arc(0, 0, R * 0.15, 0, Math.PI * 2);
      c.fill();
      c.stroke();
      c.restore();
    } else if (accessory === 'crown') {
      // star crown on top of the head
      c.save();
      c.translate(0, -R * 0.98);
      c.fillStyle = '#ffd866';
      c.strokeStyle = '#c9942f';
      c.lineWidth = Math.max(1.5, R * 0.04);
      c.beginPath();
      c.moveTo(-R * 0.44, R * 0.14);
      c.lineTo(-R * 0.44, -R * 0.08);
      c.lineTo(-R * 0.22, R * 0.08);
      c.lineTo(0, -R * 0.24);
      c.lineTo(R * 0.22, R * 0.08);
      c.lineTo(R * 0.44, -R * 0.08);
      c.lineTo(R * 0.44, R * 0.14);
      c.closePath();
      c.fill();
      c.stroke();
      c.fillStyle = '#8f8ae0';
      c.beginPath();
      c.arc(0, 0, R * 0.08, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
    c.restore();
  }

  function drawSkinAccessoryBehind(accessory, c, R) {
    if (!accessory) return;
    c = c || ctx;
    R = R || PLAYER_RADIUS;
    c.save();
    c.scale(1.6, 1.6);
    if (accessory === 'cape') {
      // cape now sits behind the character, flipped so it rises like a collar behind the shoulders
      c.save();
      c.translate(0, R * 0.68);
      c.scale(0.85, 0.85);
      c.fillStyle = '#5a3a5f';
      c.strokeStyle = '#3f2943';
      c.lineWidth = Math.max(1, R * 0.02);
      c.beginPath();
      c.moveTo(-R * 0.95, R * 0.4);
      c.lineTo(R * 0.95, R * 0.4);
      c.lineTo(R * 0.7, -R * 1.05);
      c.lineTo(0, -R * 0.85);
      c.lineTo(-R * 0.7, -R * 1.05);
      c.closePath();
      c.globalAlpha = 0.92;
      c.fill();
      c.stroke();
      c.globalAlpha = 1;
      c.restore();
    } else if (accessory === 'crown') {
      // small white bird-style wings sprouting from the back
      c.save();
      c.fillStyle = '#ffffff';
      c.strokeStyle = '#dfe6ee';
      c.lineWidth = Math.max(1, R * 0.018);
      const drawWing = (mirror) => {
        c.save();
        c.translate(mirror * R * 0.6, R * 0.08);
        c.scale(mirror, 1);
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(R * 0.1, -R * 0.42, R * 0.34, -R * 0.5);
        c.quadraticCurveTo(R * 0.22, -R * 0.32, R * 0.4, -R * 0.22);
        c.quadraticCurveTo(R * 0.26, -R * 0.14, R * 0.36, -R * 0.02);
        c.quadraticCurveTo(R * 0.2, 0.0, R * 0.26, R * 0.12);
        c.quadraticCurveTo(R * 0.1, R * 0.06, 0, R * 0.12);
        c.closePath();
        c.fill();
        c.stroke();
        c.restore();
      };
      drawWing(-1);
      drawWing(1);
      c.restore();
    }
    c.restore();
  }

  function drawMeteor(m) {
    const trailRgb = m.type.trail;
    const bodyColor = m.type.body;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    if (m.type.behavior === 'stealth') {
      ctx.globalAlpha = 0.25 + Math.abs(Math.sin((elapsed - m.spawnedAt) * 3)) * 0.65;
    }

    const trail = ctx.createLinearGradient(0, -m.r * 3, 0, 0);
    trail.addColorStop(0, `rgba(${trailRgb},0)`);
    trail.addColorStop(1, `rgba(${trailRgb},0.35)`);
    ctx.fillStyle = trail;
    ctx.beginPath();
    ctx.ellipse(0, -m.r * 1.4, m.r * 0.5, m.r * 1.6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    const spikes = 7;
    for (let i = 0; i < spikes; i++) {
      const ang = (i / spikes) * Math.PI * 2;
      const rad = m.r * (0.82 + (i % 2 === 0 ? 0.18 : 0));
      const x = Math.cos(ang) * rad;
      const y = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = `rgba(${trailRgb},0.55)`;
    ctx.beginPath();
    ctx.arc(-m.r * 0.2, -m.r * 0.2, m.r * 0.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawPowerup(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const pulse = 1 + Math.sin(p.age * 6) * 0.08;
    ctx.scale(pulse, pulse);
    ctx.rotate(Math.sin(p.age * 1.5) * 0.15);

    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, p.r * 2.4);
    glow.addColorStop(0, p.type.hex + 'aa');
    glow.addColorStop(1, p.type.hex + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // faceted gem body
    const rTop = p.r * 1.25, rSide = p.r * 0.9, facetY = -p.r * 0.15;
    ctx.fillStyle = p.type.hex;
    ctx.beginPath();
    ctx.moveTo(0, -rTop);
    ctx.lineTo(rSide, facetY);
    ctx.lineTo(p.r * 0.55, rTop * 0.85);
    ctx.lineTo(-p.r * 0.55, rTop * 0.85);
    ctx.lineTo(-rSide, facetY);
    ctx.closePath();
    ctx.fill();

    // top facet highlight
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, -rTop);
    ctx.lineTo(rSide, facetY);
    ctx.lineTo(0, facetY * 0.25);
    ctx.lineTo(-rSide, facetY);
    ctx.closePath();
    ctx.fill();

    // thin facet lines for a cut-gem look
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = Math.max(1, p.r * 0.06);
    ctx.beginPath();
    ctx.moveTo(0, -rTop); ctx.lineTo(0, rTop * 0.85);
    ctx.stroke();

    // consistent gold sparkle outline, present on every powerup regardless of color,
    // so it always reads as "magic item" and never gets mistaken for a meteor
    ctx.strokeStyle = 'rgba(255,216,102,0.9)';
    ctx.lineWidth = Math.max(1.5, p.r * 0.09);
    ctx.beginPath();
    ctx.moveTo(0, -rTop);
    ctx.lineTo(rSide, facetY);
    ctx.lineTo(p.r * 0.55, rTop * 0.85);
    ctx.lineTo(-p.r * 0.55, rTop * 0.85);
    ctx.lineTo(-rSide, facetY);
    ctx.closePath();
    ctx.stroke();

    // orbiting mini sparkles
    ctx.fillStyle = 'rgba(255,216,102,0.95)';
    for (let i = 0; i < 3; i++) {
      const ang = p.age * 2 + (i / 3) * Math.PI * 2;
      const orbitR = p.r * 1.9;
      const sx = Math.cos(ang) * orbitR, sy = Math.sin(ang) * orbitR * 0.6;
      const s = p.r * 0.14 * (0.6 + 0.4 * Math.sin(p.age * 4 + i));
      ctx.beginPath();
      ctx.moveTo(sx, sy - s); ctx.lineTo(sx + s * 0.6, sy); ctx.lineTo(sx, sy + s); ctx.lineTo(sx - s * 0.6, sy);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawLightOrb(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    const pulse = 1 + Math.sin(o.age * 5) * 0.15;
    ctx.scale(pulse, pulse);

    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, o.r * 2.6);
    glow.addColorStop(0, 'rgba(255,242,176,0.9)');
    glow.addColorStop(1, 'rgba(255,242,176,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, o.r * 2.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff2b0';
    ctx.beginPath();
    const spikes = 4, outerR = o.r, innerR = o.r * 0.42;
    for (let i = 0; i < spikes * 2; i++) {
      const ang = (i / (spikes * 2)) * Math.PI * 2;
      const rad = i % 2 === 0 ? outerR : innerR;
      const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawAilment(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    const wobble = Math.sin(a.age * 3) * 0.12;
    ctx.rotate(wobble);

    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, a.r * 2.2);
    glow.addColorStop(0, 'rgba(70,60,90,0.55)');
    glow.addColorStop(1, 'rgba(70,60,90,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, a.r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // tarnished star: same silhouette family as the light orb, but dim and cracked
    ctx.fillStyle = a.type.hex;
    ctx.beginPath();
    const spikes = 4, outerR = a.r, innerR = a.r * 0.4;
    for (let i = 0; i < spikes * 2; i++) {
      const ang = (i / (spikes * 2)) * Math.PI * 2;
      const rad = i % 2 === 0 ? outerR : innerR;
      const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();

    // crack line across the star, and a faint wisp trailing off it
    ctx.strokeStyle = 'rgba(10,14,39,0.65)';
    ctx.lineWidth = Math.max(1, a.r * 0.13);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-a.r * 0.5, -a.r * 0.35);
    ctx.lineTo(a.r * 0.08, a.r * 0.02);
    ctx.lineTo(-a.r * 0.12, a.r * 0.18);
    ctx.lineTo(a.r * 0.5, a.r * 0.6);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(150,140,165,0.4)';
    ctx.lineWidth = Math.max(1, a.r * 0.1);
    ctx.beginPath();
    ctx.moveTo(a.r * 0.3, -a.r * 0.9);
    ctx.quadraticCurveTo(a.r * 0.7, -a.r * 1.3, a.r * 0.5, -a.r * 1.8);
    ctx.stroke();

    ctx.restore();
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 120;
      particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.3, age: 0, color
      });
    }
  }

  function spawnPopup(x, y, text, color) {
    popups.push({ x, y, text, color, age: 0, life: 0.9 });
  }

  function drawStarFootMarks() {
    for (const m of starFootMarks) {
      const p = m.age / m.life;
      const popIn = p < 0.15 ? (p / 0.15) * 1.25 : Math.max(0, 1.25 - ((p - 0.15) / 0.15) * 0.25);
      const alpha = p < 0.55 ? 1 : 1 - (p - 0.55) / 0.45;
      const size = PLAYER_RADIUS * 0.55 * Math.min(1, popIn);
      const rot = m.age * 3;
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.globalAlpha = Math.max(0, alpha);

      // expanding shockwave ring
      const ringP = Math.min(1, m.age / 0.35);
      ctx.strokeStyle = `rgba(255,246,200,${0.7 * (1 - ringP)})`;
      ctx.lineWidth = Math.max(1, PLAYER_RADIUS * 0.05);
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS * 0.3 + ringP * PLAYER_RADIUS * 0.9, 0, Math.PI * 2);
      ctx.stroke();

      const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, size * 2.6);
      glow.addColorStop(0, 'rgba(255,246,200,0.7)');
      glow.addColorStop(1, 'rgba(255,246,200,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, size * 2.6, 0, Math.PI * 2);
      ctx.fill();

      // radiating burst rays
      ctx.save();
      ctx.rotate(rot * 0.4);
      ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - p)})`;
      ctx.lineWidth = Math.max(1, size * 0.12);
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * size * 0.9, Math.sin(ang) * size * 0.9);
        ctx.lineTo(Math.cos(ang) * size * 1.7, Math.sin(ang) * size * 1.7);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.rotate(rot);
      ctx.fillStyle = '#fff9d6';
      ctx.beginPath();
      const spikes = 4, outerR = size, innerR = size * 0.4;
      for (let i = 0; i < spikes * 2; i++) {
        const ang = (i / (spikes * 2)) * Math.PI * 2;
        const rad = i % 2 === 0 ? outerR : innerR;
        const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawParticlesAndPopups(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.age += dt;
      if (pt.age > pt.life) { particles.splice(i, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      const a = 1 - pt.age / pt.life;
      ctx.fillStyle = pt.color + Math.floor(a * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3 * a + 1, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.age += dt;
      if (p.age > p.life) { popups.splice(i, 1); continue; }
      const t = p.age / p.life;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.color;
      ctx.font = "bold 20px 'Baloo 2', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y - t * 40);
      ctx.restore();
    }
  }

  function update(dt) {
    elapsed += dt;

    const scoreMultActive = elapsed < effects.scoreMultUntil;
    const slowActive = elapsed < effects.slowUntil;
    const shieldActive = elapsed < effects.shieldUntil;
    const shrinkActive = elapsed < effects.shrinkUntil;
    const magnetActive = elapsed < effects.magnetUntil;

    const gain = dt * 10 * combo * (scoreMultActive ? 2 : 1);
    score += gain;

    const diff = currentDifficulty(elapsed);

    let dir = 0;
    if (keys.left || touchLeft) dir -= 1;
    if (keys.right || touchRight) dir += 1;
    if (elapsed < effects.confuseUntil) dir = -dir;
    const moveSpeedFactor = elapsed < effects.moveSlowUntil ? 0.5 : 1;
    player.x += dir * MOVE_SPEED * moveSpeedFactor * dt;
    player.x = Math.max(PLAYER_RADIUS, Math.min(width - PLAYER_RADIUS, player.x));

    if (currentSkin.accessory === 'trail' && dir !== 0) {
      trailTimer -= dt;
      if (trailTimer <= 0) {
        trailTimer = 0.06;
        spawnParticles(player.x, height - 90 + (Math.random() * 20 - 10), '#ffd866', 1);
      }
    }

    if (currentSkin.accessory === 'starfoot' && dir !== 0) {
      starFootTimer -= dt;
      if (starFootTimer <= 0) {
        starFootTimer = 0.2;
        starFootSide = -starFootSide;
        starFootMarks.push({ x: player.x + starFootSide * PLAYER_RADIUS * 0.42, y: height - 50, age: 0, life: 0.85 });
        spawnParticles(player.x + starFootSide * PLAYER_RADIUS * 0.42, height - 50, '#fff2b0', 8);
      }
    }
    for (let i = starFootMarks.length - 1; i >= 0; i--) {
      starFootMarks[i].age += dt;
      if (starFootMarks[i].age >= starFootMarks[i].life) starFootMarks.splice(i, 1);
    }

    // meteor spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = diff.interval;
      const type = pickMeteorType(elapsed);
      const seen = addToArraySet(SEEN_METEORS_KEY, type.key);
      if (seen.length >= METEOR_TYPES.length && unlockAchievement('meteor_collector')) achievementToast('meteor_collector');
      const r = (28 + Math.random() * 20) * sizeScale() * type.sizeMult;
      const baseX = Math.random() * (width - r * 2) + r;
      const makeMeteor = (x) => ({
        x,
        y: -r * 2,
        r,
        speed: diff.speed * (0.85 + Math.random() * 0.3) * type.speedMult,
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 2,
        resolved: false,
        minDist: Infinity,
        type,
        spawnedAt: elapsed,
        oscAmp: 60 + Math.random() * 40,
        oscFreq: 2 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2
      });
      meteors.push(makeMeteor(baseX));
      if (type.behavior === 'twin') {
        const gap = r * 2.6;
        const otherX = Math.max(r, Math.min(width - r, baseX + (Math.random() < 0.5 ? -gap : gap)));
        meteors.push(makeMeteor(otherX));
      }
    }

    // powerup spawn
    powerupTimer -= dt;
    if (powerupTimer <= 0) {
      powerupTimer = 8 + Math.random() * 4;
      const type = pickPowerupType();
      const r = 22 * sizeScale();
      powerups.push({
        x: Math.random() * (width - r * 2) + r,
        y: -r * 2,
        r,
        speed: 140,
        type,
        age: 0
      });
    }

    lightOrbTimer -= dt;
    if (lightOrbTimer <= 0) {
      lightOrbTimer = 3 + Math.random() * 2.5;
      const r = 14 * sizeScale();
      lightOrbs.push({
        x: Math.random() * (width - r * 2) + r,
        y: -r * 2,
        r,
        speed: 150,
        age: 0
      });
    }

    ailmentTimer -= dt;
    if (ailmentTimer <= 0) {
      ailmentTimer = 12 + Math.random() * 6;
      const type = pickAilmentType();
      const r = 20 * sizeScale();
      ailments.push({
        x: Math.random() * (width - r * 2) + r,
        y: -r * 2,
        r,
        speed: 130,
        type,
        age: 0,
        resolved: false
      });
    }

    const playerY = height - 90;
    const speedFactor = slowActive ? 0.5 : 1;

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.y += m.speed * speedFactor * dt;
      m.rot += m.spin * dt;
      if (m.type.behavior === 'zigzag') {
        m.x += Math.cos((elapsed - m.spawnedAt) * m.oscFreq + m.phase) * m.oscAmp * dt;
        m.x = Math.max(m.r, Math.min(width - m.r, m.x));
      } else if (m.type.behavior === 'homing') {
        const pull = Math.sign(player.x - m.x) * 55 * dt;
        m.x = Math.max(m.r, Math.min(width - m.r, m.x + pull));
      }

      if (!m.resolved) {
        const dx = m.x - player.x, dy = m.y - playerY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const effPlayerR = PLAYER_RADIUS * (shrinkActive ? 0.55 : 0.75);
        const collisionThreshold = m.r + effPlayerR;
        const nearMissThreshold = collisionThreshold + NEAR_MISS_MARGIN;

        if (dist < collisionThreshold) {
          if (shieldActive) {
            m.resolved = true;
            spawnParticles(m.x, m.y, '#b6ffb0', 10);
            if (unlockAchievement('shield_save')) achievementToast('shield_save');
            shieldSaveCountThisPlay++;
            if (shieldSaveCountThisPlay >= 3 && unlockAchievement('shield_triple')) achievementToast('shield_triple');
          } else {
            endGame();
            return;
          }
        } else {
          if (dist < m.minDist) m.minDist = dist;
          // meteor has fully passed the player's vertical zone: finalize the check
          if (m.y - m.r > playerY + PLAYER_RADIUS) {
            m.resolved = true;
            if (m.minDist < nearMissThreshold) {
              score += 50;
              combo = Math.min(2.0, combo + 0.1);
              spawnParticles(player.x, playerY, '#ffd866', 8);
              spawnPopup(player.x, playerY - PLAYER_RADIUS, '際どい！ +50', '#ffd866');
              playNearMiss();
              if (unlockAchievement('near_miss')) achievementToast('near_miss');
              if (combo >= 2.0 && unlockAchievement('max_combo')) achievementToast('max_combo');
            }
          }
        }
      }

      if (m.y - m.r > height) meteors.splice(i, 1);
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.age += dt;
      p.y += p.speed * dt;

      if (!heldPowerup) {
        const dx = p.x - player.x, dy = p.y - playerY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < p.r + PLAYER_RADIUS * 0.9) {
          heldPowerup = p.type;
          spawnParticles(p.x, p.y, p.type.hex, 12);
          playPickup();
          updateHeldUI();
          powerups.splice(i, 1);
          continue;
        }
      }
      if (p.y - p.r > height) powerups.splice(i, 1);
    }

    for (let i = lightOrbs.length - 1; i >= 0; i--) {
      const o = lightOrbs[i];
      o.age += dt;
      o.y += o.speed * dt;
      if (magnetActive) {
        const mdx = player.x - o.x, mdy = playerY - o.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy) || 1;
        o.x += (mdx / mdist) * 260 * dt;
        o.y += (mdy / mdist) * 260 * dt;
      }

      const dx = o.x - player.x, dy = o.y - playerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < o.r + PLAYER_RADIUS * 0.85) {
        score += LIGHT_ORB_SCORE * (elapsed < effects.scoreMultUntil ? 2 : 1);
        spawnParticles(o.x, o.y, '#fff2b0', 10);
        spawnPopup(o.x, o.y, `+${LIGHT_ORB_SCORE}`, '#fff2b0');
        playLightOrb();
        lightOrbs.splice(i, 1);

        lightOrbCountThisPlay++;
        if (lightOrbCountThisPlay >= 20 && unlockAchievement('lightorb_single20')) achievementToast('lightorb_single20');
        const totalOrbs = incrementCounter(LIGHT_ORB_TOTAL_KEY);
        if (totalOrbs >= 100 && unlockAchievement('lightorb_total100')) achievementToast('lightorb_total100');

        continue;
      }
      if (o.y - o.r > height) lightOrbs.splice(i, 1);
    }

    for (let i = ailments.length - 1; i >= 0; i--) {
      const a = ailments[i];
      a.age += dt;
      a.y += a.speed * dt;

      const dx = a.x - player.x, dy = a.y - playerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < a.r + PLAYER_RADIUS * 0.8) {
        if (shieldActive) {
          spawnParticles(a.x, a.y, '#b6ffb0', 8);
        } else {
          applyAilment(a.type);
        }
        ailments.splice(i, 1);
        continue;
      }
      if (a.y - a.r > height) ailments.splice(i, 1);
    }

    scoreBox.textContent = Math.floor(score);
    roundBox.textContent = `ラウンド ${round}`;
    if (combo > 1.001) {
      comboBox.textContent = `x${combo.toFixed(1)} コンボ`;
      comboBox.classList.add('show');
    } else {
      comboBox.classList.remove('show');
    }

    const newRound = Math.floor(elapsed / ROUND_LENGTH) + 1;
    if (newRound > round) {
      if (!roundHadAilmentHit && unlockAchievement('no_hit_round')) achievementToast('no_hit_round');
      roundHadAilmentHit = false;
      round = newRound;
      roundBox.textContent = `ラウンド ${round}`;
      roundLine = getZoneLine(round);
      meteors = [];
      powerups = [];
      spawnTimer = 0;
      powerupTimer = 8 + Math.random() * 4;
      state = 'roundBreak';
      roundBreakTimer = ROUND_BREAK_DURATION;
      playRoundClear();
      if (round >= 5 && unlockAchievement('round5')) achievementToast('round5');
      if (round >= 8 && unlockAchievement('round8')) achievementToast('round8');
      if (round >= 10 && unlockAchievement('round10')) achievementToast('round10');
      if (round >= 12 && unlockAchievement('round12')) achievementToast('round12');
    }
  }

  function updateRoundBreak(dt) {
    roundBreakTimer -= dt;
    if (roundBreakTimer <= 0) state = 'playing';
  }

  function drawRoundBanner() {
    const t = 1 - Math.max(0, roundBreakTimer) / ROUND_BREAK_DURATION;
    const fade = Math.sin(Math.min(1, t) * Math.PI); // fade in then out
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(10,14,39,0.35)';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#ffd866';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `800 ${Math.min(width, height) * 0.09}px 'Baloo 2', sans-serif`;
    ctx.fillText(`ラウンド ${round}`, width / 2, height / 2);
    if (roundLine) {
      ctx.fillStyle = '#f4f2ff';
      ctx.font = `400 ${Math.min(width, height) * 0.032}px 'Nunito', sans-serif`;
      ctx.fillText(roundLine, width / 2, height / 2 + Math.min(width, height) * 0.09);
    }
    ctx.restore();
  }

  function applyPowerup(type) {
    playPowerup();
    if (type.key === 'slow') effects.slowUntil = elapsed + type.duration;
    else if (type.key === 'score') effects.scoreMultUntil = elapsed + type.duration;
    else if (type.key === 'shield') effects.shieldUntil = elapsed + type.duration;
    else if (type.key === 'clear') { meteors = []; }
    else if (type.key === 'shrink') effects.shrinkUntil = elapsed + type.duration;
    else if (type.key === 'magnet') effects.magnetUntil = elapsed + type.duration;
    const label = { slow: 'スローモーション', score: 'スコア2倍', shield: '一時無敵', clear: '画面クリア', shrink: '縮小', magnet: '光の呼び込み' }[type.key];
    spawnPopup(player.x, height - 90 - PLAYER_RADIUS - 10, label, type.hex);

    const usedTypes = addToArraySet(USED_POWERUPS_KEY, type.key);
    if (usedTypes.length >= POWERUP_TYPES.length && unlockAchievement('powerup_all')) achievementToast('powerup_all');
  }

  function applyAilment(type) {
    playAilment();
    if (type.key === 'slow') effects.moveSlowUntil = elapsed + type.duration;
    else if (type.key === 'confuse') effects.confuseUntil = elapsed + type.duration;
    else if (type.key === 'blur') effects.blurUntil = elapsed + type.duration;
    const label = { slow: '足が重い…', confuse: '目が回る…', blur: '視界がぼやける…' }[type.key];
    spawnPopup(player.x, height - 90 - PLAYER_RADIUS - 10, label, type.hex);
    combo = 1.0;
    roundHadAilmentHit = true;

    const seenAilments = addToArraySet(SEEN_AILMENTS_KEY, type.key);
    if (seenAilments.length >= AILMENT_TYPES.length && unlockAchievement('ailment_all')) achievementToast('ailment_all');
  }

  const heldItemBox = document.getElementById('heldItemBox');
  const heldItemDesc = document.getElementById('heldItemDesc');
  const useItemBtn = document.getElementById('useItemBtn');
  const discardItemBtn = document.getElementById('discardItemBtn');
  const POWERUP_DESCRIPTIONS = {
    slow: 'スローモーション：隕石の動きがゆっくりに',
    score: 'スコア2倍：しばらく得点が2倍に',
    shield: '一時無敵：隕石を1回すり抜けられる',
    clear: '画面クリア：隕石を全て消し去る',
    shrink: '縮小：しばらく当たり判定が小さくなる',
    magnet: '光の呼び込み：星の光を引き寄せる'
  };
  function powerupIconSVG(hex) {
    return `<svg width="30" height="30" viewBox="0 0 30 30">
      <polygon points="15,2 26,12 19,27 11,27 4,12" fill="${hex}" stroke="#ffd866" stroke-width="1.6"/>
      <polygon points="15,2 26,12 15,10 4,12" fill="#ffffff" opacity="0.4"/>
      <line x1="15" y1="2" x2="15" y2="27" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    </svg>`;
  }
  function updateHeldUI() {
    if (heldPowerup) {
      heldItemBox.classList.remove('hidden');
      useItemBtn.style.background = 'rgba(10,14,39,0.55)';
      useItemBtn.innerHTML = powerupIconSVG(heldPowerup.hex);
      heldItemDesc.textContent = POWERUP_DESCRIPTIONS[heldPowerup.key] || '';
    } else {
      heldItemBox.classList.add('hidden');
    }
  }
  bindTap(useItemBtn, () => {
    if (!heldPowerup || state !== 'playing') return;
    const type = heldPowerup;
    heldPowerup = null;
    updateHeldUI();
    applyPowerup(type);
  });
  bindTap(discardItemBtn, () => {
    if (!heldPowerup) return;
    heldPowerup = null;
    updateHeldUI();
    playDiscard();
  });

  function loop(ts) {
    if (state !== 'playing' && state !== 'roundBreak' && state !== 'paused') return;
    if (lastTime === null) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (state === 'playing') {
      update(dt);
    } else if (state === 'roundBreak') {
      updateRoundBreak(dt);
    }
    // paused: skip update entirely, but keep rendering the frozen scene below
    if (state !== 'playing' && state !== 'roundBreak' && state !== 'paused') return;

    const bgProgress = elapsed;
    const blurActive = elapsed < effects.blurUntil;
    if (blurActive) ctx.filter = 'blur(3.5px)';
    drawBackground(dt, bgProgress);
    for (const p of powerups) drawPowerup(p);
    for (const o of lightOrbs) drawLightOrb(o);
    for (const a of ailments) drawAilment(a);
    for (const m of meteors) drawMeteor(m);
    drawStarFootMarks();
    drawPlayer(elapsed < effects.shieldUntil, elapsed < effects.shrinkUntil);
    if (blurActive) ctx.filter = 'none';
    drawParticlesAndPopups(dt);
    if (state === 'roundBreak') drawRoundBanner();

    requestAnimationFrame(loop);
  }

  function idleLoop() {
    if (state !== 'title' && state !== 'result') return;
    drawBackground(1 / 60);
    requestAnimationFrame(idleLoop);
  }
  requestAnimationFrame(idleLoop);
})();
</script>
</body>
